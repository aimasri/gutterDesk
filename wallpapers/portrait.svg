<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#38e2fc"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fb7185"/><stop offset="100%" stop-color="#f43f5e"/></linearGradient>
    <linearGradient id="g7" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fdba74"/><stop offset="100%" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="g8" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fde047"/><stop offset="100%" stop-color="#eab308"/></linearGradient>
    <linearGradient id="g9" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="g10" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#67e8f9"/><stop offset="100%" stop-color="#00f2fe"/></linearGradient>

    <!-- Wordmark Gradients -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Deep Clean Obsidian Vignette -->
    <radialGradient id="bgVignette" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0c1114"/>
      <stop offset="50%" stop-color="#080c0e"/>
      <stop offset="100%" stop-color="#040607"/>
    </radialGradient>

    <!-- Faint Hero Backlight (Very low opacity 0.05) -->
    <radialGradient id="faintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <filter id="faintBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <!-- Reusable gutterDeck Barcode Group (Height 184, Center Y=128) -->
    <g id="deckBarcode">
      <rect x="32"  y="36" width="16" height="184" rx="6" fill="url(#g1)"/>
      <rect x="54"  y="46" width="9"  height="164" rx="4.5" fill="url(#g2)"/>
      <rect x="68"  y="46" width="22" height="164" rx="6" fill="url(#g3)"/>
      <rect x="95"  y="46" width="11" height="164" rx="5.5" fill="url(#g4)"/>
      <rect x="111" y="36" width="15" height="184" rx="6" fill="url(#g5)"/>
      <rect x="131" y="46" width="25" height="164" rx="6" fill="url(#g6)"/>
      <rect x="161" y="46" width="9"  height="164" rx="4.5" fill="url(#g7)"/>
      <rect x="175" y="46" width="17" height="164" rx="6" fill="url(#g8)"/>
      <rect x="197" y="46" width="10" height="164" rx="5" fill="url(#g9)"/>
      <rect x="212" y="36" width="16" height="184" rx="6" fill="url(#g10)"/>
    </g>

    <!-- Reusable gutterTab Bento Group (Height 184, Center Y=128) -->
    <g id="tabBento">
      <rect x="36" y="36" width="162" height="64" rx="8" fill="url(#g1)"/>
      <rect x="36"  y="108" width="77" height="50" rx="7" fill="url(#g3)"/>
      <rect x="121" y="108" width="77" height="50" rx="7" fill="url(#g5)"/>
      <rect x="36"  y="166" width="58" height="54" rx="7" fill="url(#g7)"/>
      <rect x="102" y="166" width="96" height="54" rx="7" fill="url(#g9)"/>
      <rect x="206" y="36" width="14" height="184" rx="5" fill="url(#spineGrad)"/>
    </g>

