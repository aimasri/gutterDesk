# ==============================================================================
# gutterDesk LightDM GTK Greeter Configuration
# Minimalist obsidian login & lock screen: Left hero logo, right sharp card
# ==============================================================================

[greeter]
background = /usr/share/backgrounds/gutterdesk/login-background.png
theme-name = gutterdesk
icon-theme-name = Papirus-Dark
font-name = Liberation Sans 10
cursor-theme-name = DMZ-White
cursor-theme-size = 24
indicators = ~host;~spacer;~clock;~spacer;~session;~layout;~power
clock-format = %A, %B %d  %H:%M
hide-user-image = true
round-user-image = false
highlight-logged-user = true
position = 75%,center 50%,center
screensaver-timeout = 60
user-background = false
transition-duration = 150
transition-type = ease-in-out
