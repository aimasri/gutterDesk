# ==============================================================================
# gutterDesk LightDM GTK Greeter Configuration
# Deep obsidian background, centered login card, Papirus-Dark icons, custom theme
# ==============================================================================

[greeter]
background = /usr/share/backgrounds/gutterdesk/landscape.png
theme-name = gutterdesk
icon-theme-name = Papirus-Dark
font-name = Liberation Sans 10
cursor-theme-name = DMZ-White
cursor-theme-size = 24
indicators = ~host;~spacer;~clock;~spacer;~layout;~power
clock-format = %A, %B %d  %H:%M
default-user-image = /usr/share/icons/gutterdesk/gutterdesk_128.png
hide-user-image = false
round-user-image = false
highlight-logged-user = true
position = 50%,center 50%,center
screensaver-timeout = 60
user-background = false
transition-duration = 400
transition-type = ease-in-out
